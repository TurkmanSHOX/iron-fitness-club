# =====================================================================
# IRON FITNESS CLUB - PRODUCTION NGINX REVERSE PROXY KONFIGURATSIYASI
# Joylashuv: /etc/nginx/sites-available/iron-fitness.conf
# Faollashtirish: sudo ln -s /etc/nginx/sites-available/iron-fitness.conf /etc/nginx/sites-enabled/
# =====================================================================

# 1. So'rovlar chastotasini cheklash (Rate Limiting - DDoS va Brute Force dan himoya)
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# 2. HTTP dan HTTPS ga yo'naltirish
server {
    listen 80;
    listen [::]:80;
    server_name fitnes.example.uz www.fitnes.example.uz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 3. HTTPS Asosiy Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fitnes.example.uz www.fitnes.example.uz;

    # SSL Sertifikatlari (Let's Encrypt Certbot)
    ssl_certificate /etc/letsencrypt/live/fitnes.example.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fitnes.example.uz/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/fitnes.example.uz/chain.pem;

    # Xavfsiz SSL Protokollari
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Xavfsizlik sarlavhalari (Security Headers)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval';" always;

    # Gzip siqish
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml image/svg+xml;

    # Maksimal yuklash hajmi (16MB)
    client_max_body_size 16M;

    # Ilova ildiz katalogi
    set $app_root /var/www/iron_fitness_club;

    # Statik fayllarni to'g'ridan-to'g'ri keshlab berish
    location /static/ {
        alias $app_root/app/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Yuklangan rasmlar
    location /uploads/ {
        alias $app_root/uploads/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Login sahifasiga Brute-force himoyasi
    location = /login {
        limit_req zone=login_limit burst=3 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Click & Payme Webhook API
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Asosiy Flask ilovasi (Gunicorn / Waitress WSGI ga yo'naltirish)
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 90;
        proxy_connect_timeout 90;
    }

    # Xatolik sahifalari
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
